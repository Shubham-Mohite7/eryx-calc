<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="Exact math: scientific keyboard with high precision, angle modes, memory and smart percentages">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes dig{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
    @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
    .d{animation:dig 6s infinite both}
    .pi{animation:glow 3s ease-in-out infinite}
  </style>
  <rect x="0.5" y="0.5" width="399" height="259" rx="24" fill="#000000" stroke="#26262B"/>
  <text x="28" y="48" font-size="13" letter-spacing="2" font-weight="700" fill="#8E8E93" class="mono">01  ·  EXACT MATH</text>

  <text x="332" y="118" text-anchor="middle" font-size="84" font-weight="700" fill="url(#acc)" class="sans pi">π</text>

  <g class="mono" font-size="30" font-weight="700" fill="#F5F5F7">
    <text x="28" y="118"><tspan class="d" style="animation-delay:0s">3</tspan><tspan class="d" style="animation-delay:.1s" fill="#FFFFFF">.</tspan><tspan class="d" style="animation-delay:.2s">1</tspan><tspan class="d" style="animation-delay:.3s">4</tspan><tspan class="d" style="animation-delay:.4s">1</tspan><tspan class="d" style="animation-delay:.5s">5</tspan><tspan class="d" style="animation-delay:.6s">9</tspan><tspan class="d" style="animation-delay:.7s">2</tspan><tspan class="d" style="animation-delay:.8s">6</tspan><tspan class="d" style="animation-delay:.9s">5</tspan></text>
  </g>
  <text x="28" y="146" font-size="15" fill="#8E8E93" class="mono">sin(30°) = 0.5</text>

  <line x1="28" y1="168" x2="372" y2="168" stroke="#1F1F23"/>
  <text x="28" y="204" font-size="22" font-weight="700" fill="#F5F5F7" class="sans">Exact math</text>
  <text x="28" y="228" font-size="14" fill="#8E8E93" class="sans">High precision, angle modes, memory</text>
  <text x="28" y="246" font-size="14" fill="#8E8E93" class="sans">and smart percentages.</text>
</svg>
