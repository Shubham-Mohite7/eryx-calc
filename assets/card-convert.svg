<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="Converter: 12 unit categories and 28 currencies, with optional live rates">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
    @keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
    .a1{animation:nudge 2.4s ease-in-out infinite}
    .a2{animation:nudgeL 2.4s ease-in-out infinite}
    .v{animation:fade 2.4s ease-in-out infinite}
  </style>
  <rect x="0.5" y="0.5" width="399" height="259" rx="24" fill="#000000" stroke="#26262B"/>
  <text x="28" y="48" font-size="13" letter-spacing="2" font-weight="700" fill="#8E8E93" class="mono">03  ·  CONVERTER</text>

  <g class="mono">
    <rect x="28" y="66" width="344" height="40" rx="12" fill="#121214" stroke="#1F1F23"/>
    <text x="46" y="92" font-size="18" fill="#F5F5F7">1 km</text>
    <g class="a1"><text x="176" y="92" font-size="20" fill="#FFFFFF">→</text></g>
    <text x="354" y="92" text-anchor="end" font-size="18" font-weight="700" fill="#F5F5F7" class="v">0.621 mi</text>

    <rect x="28" y="116" width="344" height="40" rx="12" fill="#121214" stroke="#1F1F23"/>
    <text x="46" y="142" font-size="18" fill="#F5F5F7">1 kg</text>
    <g class="a2"><text x="176" y="142" font-size="20" fill="#FFFFFF">←</text></g>
    <text x="354" y="142" text-anchor="end" font-size="18" font-weight="700" fill="#F5F5F7" class="v" style="animation-delay:1.2s">2.205 lb</text>
  </g>

  <line x1="28" y1="172" x2="372" y2="172" stroke="#1F1F23"/>
  <text x="28" y="204" font-size="22" font-weight="700" fill="#F5F5F7" class="sans">Converter</text>
  <text x="28" y="228" font-size="14" fill="#8E8E93" class="sans">12 unit categories and 28 currencies,</text>
  <text x="28" y="246" font-size="14" fill="#8E8E93" class="sans">with optional live rates.</text>
</svg>
