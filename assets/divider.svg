<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes run{from{transform:translateX(-360px)}to{transform:translateX(1280px)}}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
    .run{animation:run 4.5s linear infinite}
    .dot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  </style>
  <line x1="40" y1="12" x2="1240" y2="12" stroke="#26262B"/>
  <rect x="0" y="11" width="360" height="2" rx="1" fill="url(#fade)" class="run"/>
  <circle cx="640" cy="12" r="3.5" fill="#FFFFFF" class="dot"/>
</svg>
