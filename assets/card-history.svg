<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="History: search, pin, edit and undo with simple swipes">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes slide{0%{opacity:0;transform:translateX(-24px)}12%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateX(24px)}}
    @keyframes swipe{0%,40%{transform:translateX(0)}55%,70%{transform:translateX(-26px)}85%,100%{transform:translateX(0)}}
    .s1{animation:slide 7s infinite both}
    .s2{animation:slide 7s .25s infinite both}
    .s3{animation:slide 7s .5s infinite both}
    .sw{animation:swipe 7s ease-in-out infinite}
  </style>
  <rect x="0.5" y="0.5" width="399" height="259" rx="24" fill="#000000" stroke="#26262B"/>
  <text x="28" y="48" font-size="13" letter-spacing="2" font-weight="700" fill="#8E8E93" class="mono">05  ·  HISTORY</text>

  <g class="mono" font-size="15">
    <g class="s1">
      <rect x="28" y="64" width="344" height="32" rx="10" fill="#121214" stroke="#3A3A3C"/>
      <polygon points="0,-8 1.88,-2.59 7.61,-2.47 3.04,0.99 4.7,6.47 0,3.2 -4.7,6.47 -3.04,0.99 -7.61,-2.47 -1.88,-2.59" fill="url(#acc)" transform="translate(46 79)"/>
      <text x="64" y="85" fill="#C7C7CC">2,450 × 18%</text><text x="354" y="85" text-anchor="end" fill="#F5F5F7" font-weight="700">441</text>
    </g>
    <g class="s2"><g class="sw">
      <rect x="28" y="104" width="344" height="32" rx="10" fill="#121214" stroke="#1F1F23"/>
      <text x="46" y="125" fill="#C7C7CC">sin(30°) + √16</text><text x="354" y="125" text-anchor="end" fill="#F5F5F7" font-weight="700">4.5</text>
    </g></g>
    <g class="s3">
      <rect x="28" y="144" width="344" height="32" rx="10" fill="#121214" stroke="#1F1F23"/>
      <text x="46" y="165" fill="#C7C7CC">1,284.5 ÷ 4</text><text x="354" y="165" text-anchor="end" fill="#F5F5F7" font-weight="700">321.125</text>
    </g>
  </g>

  <line x1="28" y1="188" x2="372" y2="188" stroke="#1F1F23"/>
  <text x="28" y="216" font-size="22" font-weight="700" fill="#F5F5F7" class="sans">History</text>
  <text x="28" y="240" font-size="14" fill="#8E8E93" class="sans">Search, pin, edit and undo with simple swipes.</text>
</svg>
