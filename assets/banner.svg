<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">eryx — The calculator, refined</title>
  <desc id="d">eryx is an offline, ad-free Android calculator with scientific mode, graphing, converters and finance tools.</desc>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>

  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1800px)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}30%{opacity:1;transform:none}34%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
    @keyframes press{0%,18%,100%{fill:#151518}6%{fill:#3a3a42}}
    .r1{animation:rise .9s .1s ease both}
    .r2{animation:rise .9s .25s ease both}
    .r3{animation:rise .9s .45s ease both}
    .r4{animation:rise .9s .6s ease both}
    .r5{animation:rise .9s .75s ease both}
    .r6{animation:rise 1s .5s ease both}
    .cur{animation:blink 1.1s steps(1) infinite}
    .sw{animation:sweep 5s linear infinite}
    .f1{animation:float 7s ease-in-out infinite}
    .f2{animation:float 9s 1s ease-in-out infinite}
    .f3{animation:float 8s 2s ease-in-out infinite}
    .f4{animation:float 6s .5s ease-in-out infinite}
    .f5{animation:float 10s 3s ease-in-out infinite}
    .g{animation:cycle 9s infinite both}
    .g2{animation-delay:3s}
    .g3{animation-delay:6s}
    .k{animation:press 4s infinite}
  </style>

  <g clip-path="url(#round)">
    <rect width="1280" height="440" fill="#000000"/>
    <rect x="-420" y="0" width="420" height="2" fill="url(#sweepG)" class="sw"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#26262B"/>

  <!-- floating keys -->
  <g opacity="0.6">
    <g transform="translate(600 46)"><g class="f1"><rect width="52" height="52" rx="14" fill="#111113" stroke="#2A2A2F"/><text x="26" y="35" text-anchor="middle" font-size="28" fill="#FFFFFF" class="mono">−</text></g></g>
    <g transform="translate(704 178)"><g class="f2"><rect width="52" height="52" rx="14" fill="#111113" stroke="#2A2A2F"/><text x="26" y="36" text-anchor="middle" font-size="28" fill="#9A9AA0" class="mono">+</text></g></g>
    <g transform="translate(632 300)"><g class="f3"><rect width="52" height="52" rx="14" fill="#111113" stroke="#2A2A2F"/><text x="26" y="36" text-anchor="middle" font-size="28" fill="#A1A1A6" class="mono">÷</text></g></g>
    <g transform="translate(736 368)"><g class="f4"><rect width="44" height="44" rx="12" fill="#111113" stroke="#2A2A2F"/><text x="22" y="30" text-anchor="middle" font-size="22" fill="#9A9AA0" class="mono">%</text></g></g>
    <g transform="translate(1222 300)"><g class="f5"><rect width="44" height="44" rx="12" fill="#111113" stroke="#2A2A2F"/><text x="22" y="31" text-anchor="middle" font-size="24" fill="#FFFFFF" class="mono">×</text></g></g>
    <g transform="translate(28 28)"><g class="f2"><rect width="40" height="40" rx="11" fill="#111113" stroke="#2A2A2F"/><text x="20" y="28" text-anchor="middle" font-size="22" fill="#9A9AA0" class="mono">=</text></g></g>
  </g>

  <!-- left copy -->
  <g class="r1">
    <rect x="80" y="76" width="212" height="34" rx="17" fill="#0E0E10" stroke="#2A2A2F"/>
    <circle cx="101" cy="93" r="4" fill="url(#acc)"/>
    <text x="116" y="98" font-size="13" letter-spacing="1.6" fill="#B5B5BB" class="sans" font-weight="600">ANDROID  ·  v1.0.6</text>
  </g>

  <g class="r2">
    <text x="76" y="232" font-size="156" font-weight="800" fill="#F5F5F7" textLength="318" lengthAdjust="spacingAndGlyphs" class="sans" letter-spacing="-4">eryx</text>
    <rect x="412" y="112" width="12" height="128" rx="3" fill="url(#acc)" class="cur"/>
  </g>

  <text x="80" y="316" font-size="34" font-weight="600" fill="#F5F5F7" class="sans r3">The calculator, refined.</text>
  <text x="80" y="352" font-size="21" fill="#8E8E93" class="sans r4">Offline. Ad-free. Beautifully simple.</text>

  <g class="r5" font-size="15" font-weight="600" fill="#C7C7CC" text-anchor="middle">
    <g class="sans" transform="translate(0 8)">
      <rect x="80" y="372" width="110" height="32" rx="16" fill="#0E0E10" stroke="#2A2A2F"/><text x="135" y="393">Scientific</text>
      <rect x="200" y="372" width="94" height="32" rx="16" fill="#0E0E10" stroke="#2A2A2F"/><text x="247" y="393">Graphing</text>
      <rect x="304" y="372" width="102" height="32" rx="16" fill="#0E0E10" stroke="#2A2A2F"/><text x="355" y="393">Converter</text>
      <rect x="416" y="372" width="58" height="32" rx="16" fill="#0E0E10" stroke="#2A2A2F"/><text x="445" y="393">GST</text>
      <rect x="484" y="372" width="98" height="32" rx="16" fill="#0E0E10" stroke="#2A2A2F"/><text x="533" y="393">Loan EMI</text>
    </g>
  </g>

  <!-- calculator display card -->
  <g class="r6">
    <rect x="800" y="60" width="400" height="320" rx="28" fill="#000000" stroke="#2A2A2F"/>

    <g class="g">
      <text x="832" y="104" font-size="13" letter-spacing="2.4" font-weight="700" fill="#8E8E93" class="mono">GST  ·  18%</text>
      <text x="1168" y="148" text-anchor="end" font-size="22" fill="#8E8E93" class="mono">₹2,450 + 18% GST</text>
      <text x="1168" y="206" text-anchor="end" font-size="58" font-weight="700" fill="#F5F5F7" class="mono">₹2,891</text>
    </g>
    <g class="g g2">
      <text x="832" y="104" font-size="13" letter-spacing="2.4" font-weight="700" fill="#8E8E93" class="mono">LOAN EMI</text>
      <text x="1168" y="148" text-anchor="end" font-size="22" fill="#8E8E93" class="mono">₹5,00,000 · 8.5% · 20y</text>
      <text x="1168" y="206" text-anchor="end" font-size="58" font-weight="700" fill="#F5F5F7" class="mono">₹4,339</text>
    </g>
    <g class="g g3">
      <text x="832" y="104" font-size="13" letter-spacing="2.4" font-weight="700" fill="#8E8E93" class="mono">SCIENTIFIC</text>
      <text x="1168" y="148" text-anchor="end" font-size="22" fill="#8E8E93" class="mono">sin(30°) + √16</text>
      <text x="1168" y="206" text-anchor="end" font-size="58" font-weight="700" fill="#F5F5F7" class="mono">4.5</text>
    </g>

    <line x1="832" y1="226" x2="1168" y2="226" stroke="#1F1F23"/>

    <g text-anchor="middle" font-size="22" fill="#D1D1D6" class="mono">
      <rect x="832" y="244" width="76" height="44" rx="12" fill="#151518" class="k"/><text x="870" y="274">÷</text>
      <rect x="918" y="244" width="76" height="44" rx="12" fill="#151518" class="k" style="animation-delay:.5s"/><text x="956" y="274">×</text>
      <rect x="1004" y="244" width="76" height="44" rx="12" fill="#151518" class="k" style="animation-delay:1s"/><text x="1042" y="274">−</text>
      <rect x="1090" y="244" width="78" height="44" rx="12" fill="#151518" class="k" style="animation-delay:1.5s"/><text x="1129" y="274">+</text>
      <rect x="832" y="298" width="76" height="44" rx="12" fill="#151518" class="k" style="animation-delay:2s"/><text x="870" y="328">%</text>
      <rect x="918" y="298" width="76" height="44" rx="12" fill="#151518" class="k" style="animation-delay:2.5s"/><text x="956" y="328">√</text>
      <rect x="1004" y="298" width="76" height="44" rx="12" fill="#151518" class="k" style="animation-delay:3s"/><text x="1042" y="328">π</text>
      <rect x="1090" y="298" width="78" height="44" rx="12" fill="url(#acc)"/><text x="1129" y="328" fill="#000000" font-weight="800">=</text>
    </g>
  </g>
</svg>
