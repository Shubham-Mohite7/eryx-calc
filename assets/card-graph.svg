<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="Graphing: plot several functions, pinch to zoom, tap to trace">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    @keyframes draw{0%{stroke-dashoffset:420}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
    @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(344px);opacity:0}}
    .c1{stroke-dasharray:420;animation:draw 6s ease-in-out infinite}
    .c2{stroke-dasharray:420;animation:draw 6s .4s ease-in-out infinite}
    .tr{animation:scan 6s linear infinite}
  </style>
  <rect x="0.5" y="0.5" width="399" height="259" rx="24" fill="#000000" stroke="#26262B"/>
  <text x="28" y="48" font-size="13" letter-spacing="2" font-weight="700" fill="#8E8E93" class="mono">02  ·  GRAPHING</text>

  <g transform="translate(28 66)">
    <g stroke="#1B1B1F">
      <line x1="0" y1="20" x2="344" y2="20"/><line x1="0" y1="40" x2="344" y2="40"/><line x1="0" y1="60" x2="344" y2="60"/><line x1="0" y1="80" x2="344" y2="80"/>
      <line x1="43" y1="0" x2="43" y2="90"/><line x1="86" y1="0" x2="86" y2="90"/><line x1="129" y1="0" x2="129" y2="90"/><line x1="172" y1="0" x2="172" y2="90"/><line x1="215" y1="0" x2="215" y2="90"/><line x1="258" y1="0" x2="258" y2="90"/><line x1="301" y1="0" x2="301" y2="90"/>
    </g>
    <line x1="0" y1="45" x2="344" y2="45" stroke="#34343B"/>
    <path class="c1" d="M0 45 C 28 -5, 58 -5, 86 45 S 144 95, 172 45 S 230 -5, 258 45 S 316 95, 344 45" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round"/>
    <path class="c2" d="M0 70 C 60 70, 110 60, 172 35 S 290 5, 344 8" fill="none" stroke="#6E6E73" stroke-width="2.5" stroke-linecap="round"/>
    <g class="tr"><line x1="0" y1="0" x2="0" y2="90" stroke="#F5F5F7" stroke-opacity="0.35" stroke-dasharray="3 4"/></g>
  </g>

  <line x1="28" y1="168" x2="372" y2="168" stroke="#1F1F23"/>
  <text x="28" y="204" font-size="22" font-weight="700" fill="#F5F5F7" class="sans">Graphing</text>
  <text x="28" y="228" font-size="14" fill="#8E8E93" class="sans">Plot several functions. Pinch to zoom,</text>
  <text x="28" y="246" font-size="14" fill="#8E8E93" class="sans">tap to trace.</text>
</svg>
